# Builds the project site and publishes it to GitHub Pages on every push to main.
#
# The site is assembled from:
#   site/        the landing page (index.html)
#   examples/    the villa outputs, so the 3D model and build replay run live
#   studio/      AR Plan Studio, the interactive editor
#   media/       demo video, GIF and plan image
#   dist/        the packaged .plugin file for the Claude app
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r examples studio media dist _site/
          touch _site/.nojekyll
          echo "Site contents:" && find _site -type f | sort

      # Pages must be enabled once in the repo: Settings > Pages > Source: GitHub Actions
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
